      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -n -E "^e: |What went wrong" -A4 build.log | head -80

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daramash-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
